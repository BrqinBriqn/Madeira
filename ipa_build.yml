name: Build Madeira App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Madeira.app

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Install Dependencies
        run: |
          if [ -f "Podfile" ]; then
            pod install
          fi

      - name: Build
        run: |
          xcodebuild \
            -workspace madeira.xcworkspace \
            -scheme YourApp \
            -configuration Release \
            -sdk iphonesimulator \
            build

      - name: Archive
        run: |
          xcodebuild archive \
            -workspace YourApp.xcworkspace \
            -scheme YourApp \
            -archivePath build/YourApp.xcarchive

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath build/YourApp.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build
