name: Build iOS App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Madeira.app

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Install Dependencies
        run: |
          if [ -f "Podfile" ]; then
            pod install
          fi

      - name: Build
        run: |
          xcodebuild \
            -workspace Madeira.xcworkspace \
            -scheme YourApp \
            -configuration Release \
            -sdk iphonesimulator \
            build
